# Build and deploy an mdBook site (with mdbook-mermaid) to GitHub Pages
name: Deploy mdBook site to Pages

on:
  push:
    branches: ["MASTER"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: "0.5.4"
      MDBOOK_MERMAID_VERSION: "^0.17"   # 0.17+ is required for mdBook 0.5
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook and mdbook-mermaid
        run: |
          rustup update stable
          cargo install --locked --version "${MDBOOK_VERSION}" mdbook
          cargo install --locked --version "${MDBOOK_MERMAID_VERSION}" mdbook-mermaid

      - name: Verify tools
        run: |
          which mdbook mdbook-mermaid
          mdbook --version
          mdbook-mermaid --version

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with mdBook
        run: mdbook build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
