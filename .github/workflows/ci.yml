# Build, lint and test on every push and pull request.
#
# Four jobs, each answering one question:
#
# - check:     does the workspace pass fmt, clippy, the layering rules, its
#              tests and its docs? (Linux, where everything is linted.)
# - platforms: does it still compile on Windows and macOS?
# - bundle:    does the one crate crates.io gets build, package, and make a
#              game that plays?
# - book:      does every relative link lead to a page, and does mdBook
#              build? (Deploying is mdbook.yml's.)
#
# plus cargo-deny for licences and advisories. Everything here must pass:
# a job that is allowed to fail is a job nobody reads.
name: CI

on:
  push:
    branches: ["MASTER"]
  pull_request:

# A newer push to the same branch makes an older run's answer moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Tool crates are compiled at opt-level 2 in the dev profile; incremental
  # artefacts for those are large and rarely reused on a fresh runner.
  CARGO_INCREMENTAL: 0
  # No desktop to show an error box on.
  KEROSENE_NO_DIALOG: 1

jobs:
  check:
    name: check (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Every crate depends only on the layers below it; see
      # xtask/src/layers.rs and src/refactor/.
      - name: Layers
        run: cargo xtask layers

      - name: Test
        run: cargo test --workspace --locked

      # Steam is an opt-in feature, so the workspace build above never sees
      # it. It links against the redistributable the steamworks crate
      # carries, and needs no client.
      - name: Clippy (steam)
        run: cargo clippy -p kerosene-runtime -p kerosene-tools --features kerosene-runtime/steam,kerosene-tools/steam --locked -- -D warnings

      - name: Test (steam)
        run: cargo test -p kerosene-platform --features steam --locked

      # The game crate's documentation is its manual: a broken link in it is
      # a bug.
      - name: Docs
        run: cargo doc -p kerosene --no-deps --features tools --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # Compiled, not tested: the suite runs on Linux. This catches the code
  # that only builds on one platform -- a cfg, a path, a system API.
  platforms:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Check
        run: cargo check --workspace --all-targets --locked

  # The one crate crates.io gets: the workspace folded into `kerosene` by
  # `cargo xtask bundle`. Built with and without the tools, packaged the way
  # `cargo publish` would -- which builds it again, alone, from the tarball
  # -- and held under crates.io's 10 MB limit. Then what a new user does on
  # day one: make a game with it and play it. Publishing stays a person's
  # decision.
  bundle:
    name: bundle and new game
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/bundle/target
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          cache-key: bundle

      - name: Bundle
        run: cargo xtask bundle

      - name: Build
        working-directory: target/bundle/kerosene
        run: |
          cargo build
          cargo build --features tools
          cargo check --features tools,steam

      - name: Package
        working-directory: target/bundle/kerosene
        run: |
          cargo package --allow-dirty
          ls -l "$CARGO_TARGET_DIR"/package/*.crate
          if [ -n "$(find "$CARGO_TARGET_DIR/package" -name '*.crate' -size +10M)" ]; then
            echo "over crates.io's 10 MB limit"
            exit 1
          fi

      - name: Make a game
        run: |
          cargo run --manifest-path target/bundle/kerosene/Cargo.toml --features tools \
            --bin kerosene-tools -- new "$RUNNER_TEMP/ci_game" \
            --name "CI Game" --kerosene-path target/bundle/kerosene

      - name: Test the game
        working-directory: ${{ runner.temp }}/ci_game
        run: cargo test

      - name: Play the game headless
        working-directory: ${{ runner.temp }}/ci_game
        # The engine logs to stderr.
        run: |
          set -o pipefail
          cargo play -- --headless 120 2>&1 | tee play.log
          grep -q "picked up a gem" play.log

  book:
    name: book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Links
        run: python3 scripts/check-links.py
      - uses: Swatinem/rust-cache@v2
        with:
          key: book
      - name: Install mdBook
        run: cargo install --locked --version 0.5.4 mdbook && cargo install --locked --version "^0.17" mdbook-mermaid
      - name: Build
        run: mdbook build

  licences:
    name: licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories bans sources
