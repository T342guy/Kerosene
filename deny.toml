# cargo-deny: what Kerosene may depend on.
#
#   cargo deny check licenses advisories bans sources
#
# Kerosene is GPL-3.0-or-later with the Kerosene Exception, and a game built
# on it links every crate below. So every dependency's licence has to be one
# a GPL work may include, and one the Exception lets a game ship under its
# own terms (see LICENSE-EXCEPTION and src/docs/licensing.md). The list is
# the permissive licences the tree actually uses; a new one is a decision,
# not a version bump, and fails CI until someone makes it here.

[graph]
all-features = false
# Steam links Valve's SDK, which is not free software and is an Independent
# Module under the Exception. It is off by default and checked separately.
exclude = ["steamworks", "steamworks-sys"]

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "Unlicense",
    "CC0-1.0",
    "Unicode-3.0",
    # File-level copyleft: fine to link, and changes to those files stay open.
    "MPL-2.0",
    # The fonts egui carries.
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # Kerosene itself: the GPL with the Kerosene Exception, the addition
    # that lets a game link Kerosene -- statically or dynamically -- and
    # stay the developer's. Allowed only with it.
    "GPL-3.0-or-later WITH AdditionRef-Kerosene-Exception-1.0",
]

[advisories]
# A crate withdrawn or unmaintained is worth knowing about; a vulnerability
# is worth failing over.
unmaintained = "workspace"
yanked = "warn"

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Path dependencies inside the workspace have no version on their own.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
