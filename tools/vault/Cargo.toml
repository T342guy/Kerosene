[package]
name = "kerosene-vault"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
# Published only as part of the one `kerosene` crate: `cargo xtask bundle`.
publish = false
description = "Vault: packs and inspects Kerosene .vault content archives."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

# Named kerosene-vault so the package name is Kerosene's; the library keeps its short
# name. Not published by itself: `cargo xtask bundle` folds it into `kerosene`.
[lib]
name = "vault"
path = "src/lib.rs"

[dependencies]
kerosene-vfs.workspace = true
anyhow.workspace = true
clap.workspace = true
log.workspace = true
env_logger.workspace = true
