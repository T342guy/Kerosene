[package]
name = "chisel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# The texture build runs inside the editor, in-process, so the editor works
# even when it is the only binary present.
alchemy = { path = "../alchemy" }
# For one thing only: what a material means to the compiler. The editor
# explaining tool textures differently from the tool that acts on them would
# be worse than not explaining them at all.
cleave = { path = "../cleave" }
# And for one more: how far a door travels. The editor draws where a door
# ends up, and a second copy of that formula would agree with the game only
# by luck.
kerosene-game.workspace = true
kerosene-math.workspace = true
kerosene-map.workspace = true
kerosene-kv.workspace = true
kerosene-bsp.workspace = true
kerosene-asset.workspace = true
kerosene-vfs.workspace = true
kerosene-render.workspace = true
kerosene-entity.workspace = true
anyhow.workspace = true
log.workspace = true
glam.workspace = true
egui.workspace = true
image.workspace = true
