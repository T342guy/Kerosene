[package]
name = "kerosene-chisel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
# Published only as part of the one `kerosene` crate: `cargo xtask bundle`.
publish = false
description = "Chisel: the Kerosene level editor."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

# Named kerosene-chisel so the package name is Kerosene's; the library keeps its short
# name. Not published by itself: `cargo xtask bundle` folds it into `kerosene`.
[lib]
name = "chisel"
path = "src/lib.rs"

[dependencies]
# The texture build runs inside the editor, in-process, so the editor works
# even when it is the only binary present.
alchemy.workspace = true
# For one thing only: what a material means to the compiler. The editor
# explaining tool textures differently from the tool that acts on them would
# be worse than not explaining them at all.
cleave.workspace = true
# And for one more: how far a door travels. The editor draws where a door
# ends up, and a second copy of that formula would agree with the game only
# by luck.
kerosene-game.workspace = true
kerosene-math.workspace = true
kerosene-map.workspace = true
kerosene-kv.workspace = true
kerosene-asset.workspace = true
kerosene-vfs.workspace = true
kerosene-render.workspace = true
# The theme and the widgets every tool in the window draws with.
kerosene-toolui.workspace = true
kerosene-entity.workspace = true
anyhow.workspace = true
log.workspace = true
glam.workspace = true
egui.workspace = true
# The 3D pane renders through the device the toolset's window already has.
egui-wgpu.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
image.workspace = true

[dev-dependencies]
# The GPU pane test asks for an adapter and waits on it.
pollster.workspace = true
