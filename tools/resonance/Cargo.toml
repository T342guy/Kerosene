[package]
name = "kerosene-resonance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
# Published only as part of the one `kerosene` crate: `cargo xtask bundle`.
publish = false
description = "Resonance: the Kerosene acoustics baker."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

# Named kerosene-resonance so the package name is Kerosene's; the library keeps its short
# name. Not published by itself: `cargo xtask bundle` folds it into `kerosene`.
[lib]
name = "resonance"
path = "src/lib.rs"

[dependencies]
kerosene-math.workspace = true
kerosene-bsp.workspace = true
kerosene-asset.workspace = true
kerosene-vfs.workspace = true
kerosene-kv.workspace = true
umbra.workspace = true
anyhow.workspace = true
clap.workspace = true
log.workspace = true
rayon.workspace = true

[dev-dependencies]
cleave.workspace = true
kerosene-map.workspace = true
