[package]
name = "kerosene-alchemy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Alchemy: the Kerosene texture compiler and material authoring tool."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

# Published as kerosene-alchemy; the library keeps its short name.
[lib]
name = "alchemy"
path = "src/lib.rs"

[dependencies]
kerosene-asset.workspace = true
kerosene-kv.workspace = true
kerosene-math.workspace = true
anyhow.workspace = true
clap.workspace = true
log.workspace = true
env_logger.workspace = true
image.workspace = true
glam.workspace = true

[dev-dependencies]
# For one cross-check: every tool texture this set draws must be a tool the
# compiler actually understands, and every tool it understands must have a
# texture. Offering one it treats as world geometry would silently wall off a
# doorway.
cleave.workspace = true
