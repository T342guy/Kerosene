[package]
name = "kerosene-alchemy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
# Published only as part of the one `kerosene` crate: `cargo xtask bundle`.
publish = false
description = "Alchemy: the Kerosene texture compiler and material authoring tool."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

# Named kerosene-alchemy so the package name is Kerosene's; the library keeps its short
# name. Not published by itself: `cargo xtask bundle` folds it into `kerosene`.
[lib]
name = "alchemy"
path = "src/lib.rs"

[dependencies]
kerosene-vfs.workspace = true
kerosene-asset.workspace = true
kerosene-resource.workspace = true
anyhow.workspace = true
clap.workspace = true
log.workspace = true
env_logger.workspace = true
image.workspace = true
glam.workspace = true

[dev-dependencies]
# For one cross-check: every tool texture this set draws must be a tool the
# compiler actually understands, and every tool it understands must have a
# texture. Offering one it treats as world geometry would silently wall off a
# doorway.
cleave.workspace = true
