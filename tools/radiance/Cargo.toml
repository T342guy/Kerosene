[package]
name = "kerosene-radiance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
# Published only as part of the one `kerosene` crate: `cargo xtask bundle`.
publish = false
description = "Radiance: the Kerosene static lighting baker."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

# Named kerosene-radiance so the package name is Kerosene's; the library keeps its short
# name. Not published by itself: `cargo xtask bundle` folds it into `kerosene`.
[lib]
name = "radiance"
path = "src/lib.rs"

[dependencies]
kerosene-math.workspace = true
kerosene-bsp.workspace = true
kerosene-kv.workspace = true
anyhow.workspace = true
clap.workspace = true
log.workspace = true
env_logger.workspace = true
rayon.workspace = true
glam.workspace = true
