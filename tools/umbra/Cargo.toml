[package]
name = "kerosene-umbra"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
# Published only as part of the one `kerosene` crate: `cargo xtask bundle`.
publish = false
description = "Umbra: the Kerosene potentially-visible-set compiler."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

# Named kerosene-umbra so the package name is Kerosene's; the library keeps its short
# name. Not published by itself: `cargo xtask bundle` folds it into `kerosene`.
[lib]
name = "umbra"
path = "src/lib.rs"

[dependencies]
kerosene-math.workspace = true
kerosene-bsp.workspace = true
anyhow.workspace = true
clap.workspace = true
log.workspace = true
env_logger.workspace = true
rayon.workspace = true
glam.workspace = true
thiserror.workspace = true
