[package]
name = "kerosene-forge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
# Published only as part of the one `kerosene` crate: `cargo xtask bundle`.
publish = false
description = "Forge: the Kerosene model compiler, from OBJ and glTF."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

# Named kerosene-forge so the package name is Kerosene's; the library keeps its short
# name. Not published by itself: `cargo xtask bundle` folds it into `kerosene`.
[lib]
name = "forge"
path = "src/lib.rs"

[dependencies]
kerosene-asset.workspace = true
kerosene-math.workspace = true
anyhow.workspace = true
clap.workspace = true
log.workspace = true
env_logger.workspace = true
glam.workspace = true
bytemuck.workspace = true
thiserror.workspace = true
gltf.workspace = true
