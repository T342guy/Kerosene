[package]
name = "kerosene-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "The Kerosene toolset: editor and every compiler in one application, with headless subcommands."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

# The whole toolset: one GUI application with a project page, the editor, the
# sound editor, a build form and an archive form behind one window, plus the
# same stages as headless subcommands for scripts and build servers.
#
# It depends on the tools' libraries, never on the engine: the boundary is the
# same one that used to separate the programs from the runtime.

[features]
# `workshop upload`, through Valve's SDK. Off by default for the same reason
# as the engine's: see kerosene-platform.
steam = ["dep:steamworks"]

[lib]
name = "kerosene_tools"
path = "src/lib.rs"

[dependencies]
chisel.workspace = true
cleave.workspace = true
umbra.workspace = true
resonance.workspace = true
radiance.workspace = true
alchemy.workspace = true
forge.workspace = true
kiln.workspace = true
vault.workspace = true
timbre.workspace = true
loupe.workspace = true
kerosene-toolui.workspace = true
kerosene-vfs.workspace = true
kerosene-map.workspace = true
kerosene-math.workspace = true
kerosene-kv.workspace = true
kerosene-console.workspace = true
egui.workspace = true
clap.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
steamworks = { workspace = true, optional = true }

[[bin]]
name = "kerosene-tools"
path = "src/main.rs"
