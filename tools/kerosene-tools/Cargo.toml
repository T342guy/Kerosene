[package]
name = "kerosene-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# The whole toolset: one GUI application with the editor, the sound editor, a
# build panel and an archive panel behind one window, plus the same stages as
# headless subcommands for scripts and build servers.
#
# It depends on the tools' libraries, never on the engine: the boundary is the
# same one that used to separate the programs from the runtime.

[lib]
name = "kerosene_tools"
path = "src/lib.rs"

[dependencies]
chisel = { path = "../chisel" }
cleave = { path = "../cleave" }
umbra = { path = "../umbra" }
radiance = { path = "../radiance" }
alchemy = { path = "../alchemy" }
forge = { path = "../forge" }
kiln = { path = "../kiln" }
vault = { path = "../vault" }
timbre = { path = "../timbre" }
kerosene-ui.workspace = true
kerosene-vfs.workspace = true
egui.workspace = true
clap.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true

[[bin]]
name = "kerosene-tools"
path = "src/main.rs"
