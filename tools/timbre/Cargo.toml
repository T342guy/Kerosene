[package]
name = "kerosene-timbre"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
# Published only as part of the one `kerosene` crate: `cargo xtask bundle`.
publish = false
description = "Timbre: the Kerosene sound compiler and editor."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

# Named kerosene-timbre so the package name is Kerosene's; the library keeps its short
# name. Not published by itself: `cargo xtask bundle` folds it into `kerosene`.
[lib]
name = "timbre"
path = "src/lib.rs"

[dependencies]
# The compile is a library call as well as a program, so Kiln drives the same
# code the window does and the two cannot disagree about what a build is.
kerosene-audio = { workspace = true, features = ["device"] }
kerosene-kv.workspace = true
symphonia.workspace = true
kerosene-vfs.workspace = true
kerosene-toolui.workspace = true
egui.workspace = true
anyhow.workspace = true
clap.workspace = true
log.workspace = true
env_logger.workspace = true
