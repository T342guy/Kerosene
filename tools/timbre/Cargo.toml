[package]
name = "kerosene-timbre"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Timbre: the Kerosene sound compiler and editor."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

# Published as kerosene-timbre; the library keeps its short name.
[lib]
name = "timbre"
path = "src/lib.rs"

[dependencies]
# The compile is a library call as well as a program, so Kiln drives the same
# code the window does and the two cannot disagree about what a build is.
kerosene-audio = { workspace = true, features = ["device"] }
kerosene-kv.workspace = true
symphonia.workspace = true
kerosene-vfs.workspace = true
kerosene-toolui.workspace = true
egui.workspace = true
anyhow.workspace = true
clap.workspace = true
log.workspace = true
env_logger.workspace = true
