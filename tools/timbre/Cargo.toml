[package]
name = "timbre"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "timbre"
path = "src/lib.rs"

[[bin]]
name = "timbre"
path = "src/main.rs"

[dependencies]
# The compile is a library call as well as a program, so Kiln drives the same
# code the window does and the two cannot disagree about what a build is.
void-audio = { workspace = true, features = ["device"] }
void-kv.workspace = true
symphonia.workspace = true
void-vfs.workspace = true
void-ui.workspace = true
egui.workspace = true
anyhow.workspace = true
clap.workspace = true
log.workspace = true
env_logger.workspace = true
