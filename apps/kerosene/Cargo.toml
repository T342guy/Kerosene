[package]
name = "kerosene-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
# Published only as part of the one `kerosene` crate: `cargo xtask bundle`.
publish = false
description = "The stock Kerosene runtime: the engine running the stock game."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# `cargo run -p kerosene-runtime --features steam`, or `kiln --ship --steam`.
steam = ["kerosene/steam"]

[dependencies]
kerosene.workspace = true
anyhow.workspace = true

[[bin]]
name = "kerosene"
path = "src/main.rs"
