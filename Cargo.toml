[workspace]
resolver = "3"
members = [
    "crates/kerosene-math",
    "crates/kerosene-kv",
    "crates/kerosene-config",
    "crates/kerosene-console",
    "crates/kerosene-vfs",
    "crates/kerosene-asset",
    "crates/kerosene-map",
    "crates/kerosene-bsp",
    "crates/kerosene-walk",
    "crates/kerosene-physics",
    "crates/kerosene-rigid",
    "crates/kerosene-entity",
    "crates/kerosene-render",
    "crates/kerosene-anim",
    "crates/kerosene-engine",
    "crates/kerosene-game",
    "crates/kerosene-script",
    "crates/kerosene-audio",
    "crates/kerosene-toolui",
    "crates/kerosene-ui",
    "crates/kerosene-platform",
    "crates/kerosene",
    "apps/kerosene",
    "tools/chisel",
    "tools/cleave",
    "tools/umbra",
    "tools/resonance",
    "tools/radiance",
    "tools/alchemy",
    "tools/timbre",
    "tools/kiln",
    "tools/forge",
    "tools/vault",
    "tools/loupe",
    "tools/kerosene-tools",
]

[workspace.package]
version = "1.0.0-a1"
edition = "2024"
rust-version = "1.94"
license = "GPL-3.0-or-later WITH AdditionRef-Kerosene-Exception-1.0"
authors = ["T342guy"]
repository = "https://github.com/t342guy/kerosene"
homepage = "https://github.com/t342guy/kerosene"
keywords = ["gamedev", "game-engine", "bsp", "level-editor", "3d"]
categories = ["game-engines", "game-development"]

[workspace.dependencies]
# Every Kerosene crate is one version, and each names the others at exactly
# that version: they are released together and never mixed. The version is
# the `kerosene` crate's; see src/docs/versioning.md and scripts/bump-version.sh.
kerosene-math    = { version = "=1.0.0-a1", path = "crates/kerosene-math" }
kerosene-kv      = { version = "=1.0.0-a1", path = "crates/kerosene-kv" }
kerosene-config  = { version = "=1.0.0-a1", path = "crates/kerosene-config" }
kerosene-console = { version = "=1.0.0-a1", path = "crates/kerosene-console" }
kerosene-vfs     = { version = "=1.0.0-a1", path = "crates/kerosene-vfs" }
kerosene-asset   = { version = "=1.0.0-a1", path = "crates/kerosene-asset" }
kerosene-map     = { version = "=1.0.0-a1", path = "crates/kerosene-map" }
kerosene-bsp     = { version = "=1.0.0-a1", path = "crates/kerosene-bsp" }
kerosene-walk    = { version = "=1.0.0-a1", path = "crates/kerosene-walk" }
kerosene-physics = { version = "=1.0.0-a1", path = "crates/kerosene-physics" }
kerosene-rigid   = { version = "=1.0.0-a1", path = "crates/kerosene-rigid" }
kerosene-entity  = { version = "=1.0.0-a1", path = "crates/kerosene-entity" }
kerosene-render  = { version = "=1.0.0-a1", path = "crates/kerosene-render" }
kerosene-anim    = { version = "=1.0.0-a1", path = "crates/kerosene-anim" }
kerosene-engine  = { version = "=1.0.0-a1", path = "crates/kerosene-engine" }
kerosene-game    = { version = "=1.0.0-a1", path = "crates/kerosene-game" }
kerosene-script  = { version = "=1.0.0-a1", path = "crates/kerosene-script" }
kerosene-audio   = { version = "=1.0.0-a1", path = "crates/kerosene-audio", default-features = false }
kerosene-toolui  = { version = "=1.0.0-a1", path = "crates/kerosene-toolui" }
kerosene-ui      = { version = "=1.0.0-a1", path = "crates/kerosene-ui" }
kerosene-platform = { version = "=1.0.0-a1", path = "crates/kerosene-platform" }
kerosene         = { version = "=1.0.0-a1", path = "crates/kerosene" }

# The tools, as libraries. Published as kerosene-<tool>, since the short
# names were taken on crates.io; code still says `chisel::`, `kiln::`.
chisel           = { package = "kerosene-chisel", version = "=1.0.0-a1", path = "tools/chisel" }
cleave           = { package = "kerosene-cleave", version = "=1.0.0-a1", path = "tools/cleave" }
umbra            = { package = "kerosene-umbra", version = "=1.0.0-a1", path = "tools/umbra" }
resonance        = { package = "kerosene-resonance", version = "=1.0.0-a1", path = "tools/resonance" }
radiance         = { package = "kerosene-radiance", version = "=1.0.0-a1", path = "tools/radiance" }
alchemy          = { package = "kerosene-alchemy", version = "=1.0.0-a1", path = "tools/alchemy" }
timbre           = { package = "kerosene-timbre", version = "=1.0.0-a1", path = "tools/timbre" }
forge            = { package = "kerosene-forge", version = "=1.0.0-a1", path = "tools/forge" }
vault            = { package = "kerosene-vault", version = "=1.0.0-a1", path = "tools/vault" }
kiln             = { package = "kerosene-kiln", version = "=1.0.0-a1", path = "tools/kiln" }
loupe            = { package = "kerosene-loupe", version = "=1.0.0-a1", path = "tools/loupe" }
kerosene-tools   = { version = "=1.0.0-a1", path = "tools/kerosene-tools" }
box3d-rust       = "0.2"

anyhow      = "1"
thiserror   = "2"
clap        = { version = "4", features = ["derive"] }
log         = "0.4"
env_logger  = "0.11"
bytemuck    = { version = "1", features = ["derive"] }
rayon       = "1"
glam        = { version = "0.30", features = ["bytemuck"] }
image       = { version = "0.25", default-features = false, features = ["png", "jpeg", "tga"] }
wgpu        = "25"   # pinned to what egui-wgpu 0.32 links; a second wgpu major
                     # pulls in a second naga, and the two unify
                     # codespan-reporting/termcolor in a way that breaks both
winit       = "0.30"
egui        = "0.32"
egui-wgpu   = "0.32"
egui-winit  = { version = "0.32", default-features = false, features = ["links", "wayland", "x11"] }
# Icon font for the tools. MIT OR Apache-2.0, and the only thing in the tree
# that looks like a UI asset; kept behind kerosene-toolui so every tool draws the
# same glyphs.
egui-phosphor = "0.10"
# Decodes the window icon. Already in the tree under `image`; the engine
# links this one crate rather than all of `image` for one picture.
png         = "0.18"
pollster    = "0.4"
# Scripting. Pure Rust, no C toolchain, and small enough to embed without the
# engine becoming a host for someone else's runtime.
rhai        = "1"
# The game UI (kerosene-ui). Flexbox layout and an XML reader, both pure Rust
# and MIT/Apache; the font rasteriser and the fallback font are the ones egui
# already brings into the tree.
taffy       = { version = "0.9", default-features = false, features = ["std", "taffy_tree", "flexbox", "content_size"] }
roxmltree   = "0.21"
ab_glyph    = "0.2"
epaint_default_fonts = "0.32"
# Save games. MIT OR Apache-2.0, and already in the tree underneath other
# crates; a `.kerosave` is JSON so a player, a modder or a bug report can
# read one without a tool.
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
# Steamworks, for `kerosene-platform`'s optional `steam` feature and nothing
# else. The crate is MIT OR Apache-2.0; what it binds, Valve's SDK, is not
# free software, which is why no default build enables it and the tree
# vendors none of it. A game that turns it on is a Combined Work under the
# Kerosene Exception, with the SDK as an Independent Module -- see
# src/gamedev/steam.md. `raw-bindings` for the one call the wrapper lacks
# (achievement progress toasts).
steamworks  = { version = "0.13", features = ["raw-bindings"] }
# Audio output. Needs ALSA headers on Linux (libasound2-dev); the mixer
# itself is pure Rust and builds without it.
cpal        = "0.18"
# Decoding source audio that is not WAV, for Timbre only. MPL-2.0, which is
# GPL-compatible through its own section 3.3 -- see docs/licensing.md. It is a
# build tool: the engine never links it, and `kiln --ship` never puts a tool in
# a game, so no game carries it.
symphonia   = { version = "0.6", default-features = false, features = ["flac", "mp3", "id3v2"] }
# Reading glTF models, for Forge only: MIT OR Apache-2.0. Like symphonia it
# is a build tool's dependency -- the engine reads the .keromdl Forge writes
# and never links it.
gltf        = { version = "1.4", default-features = false, features = ["import", "utils", "names"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

# Tool compiles (Cleave/Umbra/Radiance) are brutally slow in a debug build.
[profile.dev.package."*"]
opt-level = 2

# Chisel rasterises its 3D pane in software, a pixel at a time. Unoptimised
# that is a tenth of a second per frame, which is the difference between an
# editor that can be dragged around and one that cannot.
[profile.dev.package.kerosene-chisel]
opt-level = 2
