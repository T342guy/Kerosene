[package]
name = "kerosene-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
# Audio output needs ALSA headers on Linux. The mixer and everything that
# decides how a sound sounds is on regardless; this is only the last hop.
default = ["audio"]
audio = ["kerosene-audio/device"]

