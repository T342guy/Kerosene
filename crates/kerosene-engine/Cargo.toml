kerosene-render.workspace = true
glam.workspace = true
anyhow.workspace = true
log.workspace = true
winit.workspace = true
wgpu.workspace = true
pollster.workspace = true
env_logger.workspace = true
kerosene-game.workspace = true
kerosene-script.workspace = true
kerosene-audio.workspace = true
rhai.workspace = true
kerosene-kv.workspace = true
kerosene-map.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true

[dev-dependencies]
cleave = { path = "../../tools/cleave" }
