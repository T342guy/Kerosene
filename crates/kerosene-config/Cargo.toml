[package]
name = "kerosene-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Engine settings, the renderer choice and the window icon for the Kerosene game engine."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# The file format. `engineconf.keroconfig` is KeyValues, like everything else
# a person is expected to edit by hand.
kerosene-kv.workspace = true
# "vulkan" has to mean a real backend, so the mapping lives next to the enum.
wgpu.workspace = true
log.workspace = true
# The window icon is a PNG compiled into the binary.
png.workspace = true
