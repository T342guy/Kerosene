[package]
name = "void-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
# On by default, but separable: the mixer is pure Rust and the tests need no
# sound card, while cpal needs ALSA headers on Linux. `--no-default-features`
# builds and tests everything except the last hop to the speakers.
default = ["device"]
device = ["dep:cpal"]

[dependencies]
void-math.workspace = true
void-kv.workspace = true
log.workspace = true
thiserror.workspace = true
cpal = { workspace = true, optional = true }
