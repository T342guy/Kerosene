[package]
name = "kerosene"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
description = "A Rust game crate for brush-built 3D games: add it, implement Game, and play. Engine and tools in one."

# docs.rs builds the tools too, and not Steam: that links Valve's SDK.
[package.metadata.docs.rs]
features = ["tools"]

# The one crate a game names. Everything below is re-exported as a module,
# so a game's Cargo.toml has one Kerosene line and its code says
# `kerosene::engine`, `kerosene::entity`, `kerosene::math`, and the
# versions of egui, glam and rhai it sees are the engine's own.

[features]
default = ["audio"]
# Audio output. Needs ALSA headers on Linux; the mixer works without it.
audio = ["kerosene-engine/audio"]
# Steamworks: achievements, stats, leaderboards, cloud files, the Workshop.
# Links Valve's SDK, which is not free software; see the Steam page of the
# game developer docs before turning it on. `kiln --ship --steam` builds with
# it and ships the redistributable library beside the game.
steam = ["kerosene-engine/steam"]
# The toolset -- Chisel, the compilers, Kiln -- as a library, so a game can
# ship a `mygame-tools` binary that knows its classes and launches it.
tools = ["dep:kerosene-tools", "dep:chisel"]

[dependencies]
# Named without its default so that a game's `default-features = false`
# reaches the engine's audio switch rather than being silently ignored.
kerosene-engine = { version = "=1.0.0-a1", path = "../kerosene-engine", default-features = false }
kerosene-game.workspace = true
kerosene-entity.workspace = true
kerosene-math.workspace = true
kerosene-console.workspace = true
kerosene-vfs.workspace = true
kerosene-map.workspace = true
kerosene-bsp.workspace = true
kerosene-script.workspace = true
kerosene-ui.workspace = true
kerosene-platform.workspace = true
kerosene-audio.workspace = true
kerosene-render.workspace = true
kerosene-physics.workspace = true
kerosene-rigid.workspace = true
serde_json.workspace = true
kerosene-config.workspace = true
kerosene-kv.workspace = true
kerosene-asset.workspace = true
kerosene-walk.workspace = true
egui.workspace = true
glam.workspace = true
rhai.workspace = true
winit.workspace = true
anyhow.workspace = true
log.workspace = true
kerosene-tools = { workspace = true, optional = true }
chisel = { workspace = true, optional = true }
